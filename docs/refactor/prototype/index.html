<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>此间集 · 页面原型</title>
  <link rel="stylesheet" href="styles.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app" onclick="event.preventDefault(); document.getElementById('app').focus()">跳至主要内容</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#home" aria-label="此间集首页">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M3 7h9m8 0h9v7m0 5v7h-9M3 19v7h9M3 12V7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16.5" r="5.8" stroke="currentColor" stroke-width="2.4"/>
        </svg>
        <span>此间集</span>
      </a>
      <details class="demo-controls" id="demo-controls">
        <summary>原型设置</summary>
        <div class="demo-panel">
          <p>当前账号 <strong id="demo-profile">示例账号</strong></p>
          <button id="demo-sample" type="button">切换至示例账号</button>
          <button id="demo-new" type="button">切换至新账号</button>
          <label><input id="demo-map-fail" type="checkbox"> 模拟地图失败</label>
        </div>
      </details>
    </div>
  </header>
  <main class="main" id="app" tabindex="-1">
    <noscript>请在浏览器中启用 JavaScript，以体验页面原型。</noscript>
  </main>

  <template id="home-template">
    <section class="home" aria-labelledby="home-heading">
      <div class="home-heading">
        <h1 id="home-heading">我的城市足迹</h1>
        <a class="add-button" href="#add">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          添加照片
        </a>
      </div>
      <nav class="home-entries" aria-label="浏览足迹和相册">
        <a class="home-entry map-entry" href="#map" aria-labelledby="entry-map-title" aria-describedby="entry-map-detail">
          <div class="entry-copy">
            <div><h2 id="entry-map-title">城市地图</h2><p id="entry-map-detail">点开已点亮的城市，查看当地相册。</p></div>
            <span class="entry-arrow" aria-hidden="true">→</span>
          </div>
          <img class="map-illustration" src="footprint-cover.webp" alt="" width="800" height="544" decoding="async">
        </a>
        <a class="home-entry album-entry" href="#albums" aria-labelledby="entry-album-title" aria-describedby="entry-album-detail">
          <img class="album-illustration" src="arcade-cover.webp" alt="" width="840" height="560" decoding="async">
          <div class="entry-copy">
            <div><h2 id="entry-album-title">我的相册</h2><p id="entry-album-detail">按城市和年份翻阅。</p></div>
            <span class="entry-arrow" aria-hidden="true">→</span>
          </div>
        </a>
      </nav>
    </section>
  </template>
  <template id="map-template">
    <section class="footprint-page" aria-labelledby="map-heading">
      <a class="back-link" href="#home">← 首页</a>
      <div class="map-heading">
        <h1 id="map-heading" tabindex="-1">城市地图</h1>
        <p>点选地图上的城市，翻看在那里留下的照片。</p>
      </div>
      <div class="footprint-layout">
        <figure class="footprint-map" aria-label="中国城市足迹地图">
          <div id="map-surface" class="map-surface"></div>
          <figcaption class="map-caption">
            <div class="map-legend" aria-label="地图图例">
              <span><i class="legend-lit" aria-hidden="true"></i>已点亮</span>
              <span><i class="legend-unlit" aria-hidden="true"></i>暂无照片</span>
            </div>
            <a href="../../../frontend/public/map-data/NOTICE.md" target="_blank" rel="noopener">地图来源</a>
          </figcaption>
        </figure>
        <section class="footprint-library" aria-labelledby="footprint-heading">
          <div class="footprint-library-heading">
            <h2 id="footprint-heading">已点亮的城市</h2>
            <span class="footprint-total"><b id="footprint-count">0</b> 座</span>
          </div>
          <div id="footprint-cities" class="footprint-cities"></div>
        </section>
      </div>
    </section>
  </template>
</body>
</html>
