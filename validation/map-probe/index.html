<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城影记 · 地图接入验证</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:#263d35;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:18px 26px;background:white;border-bottom:1px solid #d8e0d9}h1{margin:0;font-size:24px}p{margin:6px 0}.sub{color:#64766b;font-size:13px}main{display:grid;grid-template-columns:295px 1fr;gap:16px;padding:18px}aside{padding:18px;background:white;border:1px solid #d8e0d9;border-radius:10px}input,button{font:inherit;border:1px solid #b8c8bd;border-radius:6px;padding:8px 12px}input{width:100%}button{background:white;color:#284b3b;cursor:pointer}#cities{display:grid;gap:8px;margin-top:12px}#cities button{text-align:left}#map{height:620px;background:#e5ede6;position:relative}#map-panel{border:1px solid #c8d5cb;border-radius:10px;overflow:hidden;background:white}#state{padding:10px 18px;background:#e4efe7}#album{padding:22px;min-height:220px}#years{display:flex;gap:14px;margin:20px 0}.year{padding:18px 24px;border:1px solid #c4d5c9;border-radius:10px}.year strong{display:block;font-size:24px}#report{white-space:pre-wrap;font-size:12px;color:#5c6b61;margin-top:18px}iframe{display:none}[hidden]{display:none!important}a{color:#386b52}
</style>
<header><h1>城影记 · 城市入口验证</h1><p class="sub">真实在线地图 · 六个样例城市 · 年份框为测试数据，本页不是正式产品</p></header>
<main>
<aside><label for="query">查找样例城市</label><input id="query" placeholder="输入城市名称"><div id="cities"></div><p class="sub">城市代表点为手工设置的近似测试坐标，完整目录另行验证。</p><div id="report"></div></aside>
<section id="map-panel"><div id="state" role="status">正在连接天地图…</div><div id="map"></div><div id="album" hidden><button id="back">返回地图</button><h2 id="city-title"></h2><div id="years"></div><p id="empty" hidden>这个城市还没有影集，可以先选择年份创建。</p><div id="new-album" hidden><label>年份 <select id="year"><option>2026</option><option>2025</option><option>2024</option></select></label> <button id="create">创建示例空影集</button></div><p class="sub">只测试入口与空状态；未实现真实账号、照片导入或持久保存。</p></div></section>
</main>
<iframe src="./hold" title="等待测试完成"></iframe>
<script src="./client.js" defer></script>
</html>
